name: release

# Manual only. Pick a version (or leave it blank to use the one in Cargo.toml), and this
# builds every supported binary and opens a DRAFT release. No tag exists yet: GitHub creates
# it against this commit the moment you review the draft and hit publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0). Leave blank to use the Cargo.toml version.'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [ -z "$version" ]; then
            version=$(grep -m1 '^version *= *"' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
            echo "No version given, using Cargo.toml: $version"
          else
            cargo_version=$(grep -m1 '^version *= *"' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
            if [ "$version" != "$cargo_version" ]; then
              echo "::warning::Requested $version but Cargo.toml says $cargo_version. The binaries will report $cargo_version."
            fi
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$version' is not a semver version."; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version from ${{ github.sha }}"

      - name: Reject an existing tag
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Bump the version in Cargo.toml first."
            exit 1
          fi

  build:
    name: ${{ matrix.asset }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: claude-code-sync-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: claude-code-sync-windows-arm64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: claude-code-sync-linux-x86_64
          # Built on a native arm64 runner rather than cross-compiled from x86_64. The cross
          # build needed gcc-aarch64-linux-gnu from apt, and a runner whose Azure mirror was
          # down once hung that install until the job hit the six-hour ceiling.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: claude-code-sync-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: claude-code-sync-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: claude-code-sync-macos-x86_64

    runs-on: ${{ matrix.os }}
    # A build takes minutes. Anything past this is a wedged runner, not slow work, and the
    # default six-hour ceiling is far too patient about it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/claude-code-sync"
          [ -f "$binary.exe" ] && binary="$binary.exe"
          cp "$binary" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 7

  draft:
    name: draft release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum claude-code-sync-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            claude-code-sync-*
            SHA256SUMS

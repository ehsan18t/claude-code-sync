name: release

# Builds every supported binary and opens a DRAFT release. Nothing is published until you
# review the draft on GitHub and hit publish yourself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: claude-code-sync-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: claude-code-sync-windows-arm64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: claude-code-sync-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: claude-code-sync-linux-arm64
            linker: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: claude-code-sync-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: claude-code-sync-macos-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.linker
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/claude-code-sync"
          [ -f "$binary.exe" ] && binary="$binary.exe"
          cp "$binary" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 7

  draft:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum claude-code-sync-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            claude-code-sync-*
            SHA256SUMS

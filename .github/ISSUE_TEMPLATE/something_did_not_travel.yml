name: Something did not travel
description: A file you expected in the archive was left behind, or one you did not expect was carried
labels: [classification]
body:
  - type: markdown
    attributes:
      value: |
        What travels is an allowlist, so anything unrecognised is dropped on purpose. Before opening this, check whether `~/.claude/.claude-sync-include` already solves it: one archive-relative path per line, a trailing `/` for a whole subtree.

  - type: input
    id: path
    attributes:
      label: The path
      description: Archive-relative, so `claude/…` is `~/.claude` and `agents/…` is `~/.agents`
      placeholder: claude/history.jsonl
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: Which way is it wrong
      options:
        - It was left behind and should travel
        - It was carried and should not
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it belongs on that side
      description: Is it authored by you, or generated by the tool? Does losing it change behavior silently? Roughly how large is it?
    validations:
      required: true
